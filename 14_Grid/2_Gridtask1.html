<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #gridcontainer {
            width: 800px;
            height: 450px;
            border: 2px solid black;
            margin: 30px auto;
            display:grid;
            grid-template-columns: 400px 400px;
            grid-template-rows: 150px 150px 150px;
            color:white;
        }

        #box1 {
            background-color: lightblue;
        }

        #box2 {
            background-color: rgb(28, 48, 55);
        }

        #box3 {
            background-color: rgb(50, 32, 183);
        }

        #box4 {
            background-color: rgb(16, 14, 86);
        }

        #box5 {
            background-color: rgb(149, 23, 74);
        }

        #box6 {
            background-color: rgb(150, 54, 67);
        }
    </style>
</head>

<body>
    <div id="gridcontainer">
        <div id="box1">box1</div>
        <div id="box2">box2</div>
        <div id="box3">box3</div>
        <div id="box4">box4</div>
        <div id="box5">box5</div>
        <div id="box6">box6</div>
    </div>
</body>

</html>
