<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #container {
            width: 800px;
            height: 400px;
            margin: 100px auto;
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(3,1fr);
            grid-template-rows: 1fr 1fr;
        }
        #box1{
            background-color: yellowgreen;
            grid-column:1/3;
            grid-row:1/2;
        }
        #box2{
            background-color: yellow;
            grid-column:3/4;
            grid-row:1/3;
        }
        #box3{
            background-color: violet;
        }
        #box4{
            background-color: rgb(89, 6, 89);
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="box1"></div>
        <div id="box2"></div>
        <div id="box3"></div>
        <div id="box4"></div>
    </div>
</body>

</html>
