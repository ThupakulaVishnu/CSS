<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #container {
            width: 800px;
            height: 400px;
            margin: 100px auto;
            border: 2px solid black;
            display: grid;
            grid-template-columns: repeat(6,1fr);
            grid-template-rows: 1fr 1fr;
        }
        #box1{
            background-color: yellowgreen;
        }
        #box2{
            background-color: yellow;
        }
        #box3{
            background-color: violet;
        }
        #box4{
            background-color: rgb(89, 6, 89);
        }
        #box5{
            background-color: yellowgreen;
        }
        #box6{
            background-color: yellow;
        }
        #box7{
            background-color: violet;
        }
        #box8{
            background-color: rgb(89, 6, 89);
        }
        #box9{
            background-color: yellowgreen;
        }
        #box10{
            background-color: yellow;
        }
        #box11{
            background-color: violet;
        }
        #box12{
            background-color: rgb(89, 6, 89);
        }
    </style>
</head>

<body>
    <div id="container">
        <div id="box1"></div>
        <div id="box2"></div>
        <div id="box3"></div>
        <div id="box4"></div>
        <div id="box5"></div>
        <div id="box6"></div>
        <div id="box7"></div>
        <div id="box8"></div>
        <div id="box9"></div>
        <div id="box10"></div>
        <div id="box11"></div>
        <div id="box12"></div>
    </div>
</body>

</html>
