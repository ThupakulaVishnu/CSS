<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            width:180px;
            height:180px;
            border-radius: 50%;
            background-color: lightcoral;
            margin:200px auto;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size:15px;
            color:white;
            font-weight: bold;
            transition-property: transform;
            transition-duration: 3s;
            transition-delay: 1s;
        }
        div:hover{
            background-color: brown;
            /* transform: scaleX(2); */
            /* transform: scaleY(2);  */
            transform: scale(2,2);
        }
    </style>
</head>
<body>
    <div>Scale</div>
</body>
</html>
