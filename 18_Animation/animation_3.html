<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        @keyframes basicanimation {
            0% {
                background-image: url("https://assets.thehansindia.com/h-upload/2020/08/20/992684-allu-arjun.webp");
                background-repeat: no-repeat;
                background-size: 100% 100%;
            }

            25% {
                background-image: url("https://m.media-amazon.com/images/I/61imPqiGJ8L._AC_UF894,1000_QL80_.jpg");
                background-repeat: no-repeat;
                background-size: 100% 100%;
            }

            50% {
                background-image: url("https://www.thestatesman.com/wp-content/uploads/2019/10/mahesh-babu.jpg");
                background-repeat: no-repeat;
                background-size: 100% 100%;
            }

            75% {
                background-image: url("https://i.redd.it/sifay4xvlnfe1.jpeg");
                background-repeat: no-repeat;
                background-size: 100% 100%;

            100% {
                background-image: url("https://images.moneycontrol.com/static-mcnews/2025/09/20250928134624_ram-charan-ps-intro-.jpg");

        div {
            width: 900px;
            border: 3px solid black;
            height: 500px;
            margin: 50px auto;
/* 
            background-image: url("https://assets.thehansindia.com/h-upload/2020/08/20/992684-allu-arjun.webp");
            background-repeat: no-repeat;
            background-size: 100% 100%; */

            animation-duration: 5s;
            /* animation-delay: 5s; */
            animation-iteration-count: 1;
            animation-direction: normal;
            animation-fill-mode: both;
            animation-timing-function:ease-in-out;
