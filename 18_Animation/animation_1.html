<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @keyframes basicanimation{
            from{
                background-color: blue;
                color:red;
                font-size: 10px;
                padding: 0px;
            }
            to{
                background-color: yellow;
                color:black;
                font-size:30px ;
                padding:20px;
                border: 10px solid black;
                box-shadow: 25px 10px 40px black;
            }
        }

        div{
            width: 500px;
            height:100px;
            border: 3px solid green;
            margin: 100px auto;
            display:flex;
            justify-content: center;
            align-items: center;

            animation-name:basicanimation;
            animation-duration:5s ;
            animation-delay: 3s;
        }
    </style>
</head>
<body>
    <div>Animation</div>
</body>
</html>
