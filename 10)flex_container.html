<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            div{
                border:5px solid black;
                width:1000px;
                height:400px;
                margin-top:90px;
                margin-left:80px;
                display:flex;
                /* flex-direction:row; */
                flex-direction:column ;
            }
            h1{
                margin:0px;
                /* width:300px; */
                height:100px;
                text-align:center ;
            }
            #red{
                background-color:red ;
            }
            #green{
                background-color:green ;
            }
            #pink{
                background-color:pink ;
            }
        </style>
    </head>
    <body>
        <div>
            <h1 id="red">Column 1</h1>
            <h1 id="green">Column 2</h1>
            <h1 id="pink">Column 3</h1>
        </div>
    </body>
</html>
