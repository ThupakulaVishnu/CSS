<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            #st{
                text-transform:lowercase;
                text-shadow:0px 8px 2px red;
                direction:rtl;
                letter-spacing:10px;
            }
            h2{
                text-transform:uppercase;
                text-shadow: 10px 0px 3px blue;
                direction: ltr;
                word-spacing:15px;
                border:2px dotted red;
                width:500px;
                height:350px;
            }
            #nd{
                text-transform:capitalize;
                direction:rtl;
                letter-spacing:25px;
            }
        </style>
    </head>
    <body>
        <h1 id="st">Convery all letter into lower case</h1>
        <h2>Convert all letters into upper case</h2>
        <h1 id="nd">Convert all first letter of the words as uppercase</h1>
    </body>
</html>
