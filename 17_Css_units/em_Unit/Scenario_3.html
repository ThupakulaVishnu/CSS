<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            font-size:15px;
        }
        div{
            font-size:2em ; /* 30px */
        }
        h2{
            font-size:2em; /* 60px */
            border: 2px solid red;
            width:10em;  /* 600px */
        }
    </style>
</head>
<body>
    <div>
        <h2>em unit in css</h2>
    </div>
    
</body>
</html>
