<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            font-size:50px ;
        }
        h2{   /* 50*1.5=75px*/
            border:3px solid red;  
            width:8em;   /* 75*8=600px */
            padding: 2em;   /* 75*2=150px */
            margin:3em;  /* 75*3=225px */
        }
    </style>
</head>
<body>
    <div>
        <h2>em unit in css</h2>
    </div>
    
</body>
</html>
