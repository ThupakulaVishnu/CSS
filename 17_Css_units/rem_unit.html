<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html{
            font-size:12px ;
        }
        h2{
            font-size: 2rem;   /* 2*12=24px */
            border:2px solid red;
            width:5rem;   /* 5*12=60px */
            padding:10rem;   /* 10*12=120px */
        }
    </style>
</head>
<body>
    <div>
        <h2>Welcome to CSS units rem</h2>
    </div>
</body>
</html>
