<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <style>
        #btn{
            margin:50px 100px;
            background-color: blueviolet;
            color:white;
            padding:7px 13px;
            border-radius: 10px;
            border:none;
        }
    </style>
</head>

<body>
    <button id="btn">without Bootstrap</button>

    <button class="btn">Bootstrap</button>
    <button class="btn btn-primary">Bootstrap</button>
    <button class="btn btn-secondary">Bootstrap</button>
    <button class="btn btn-success">Bootstrap</button>
    <button class="btn btn-danger">Bootstrap</button>
    <button class="btn btn-warning">Bootstrap</button>
    <button class="btn btn-info">Bootstrap</button>
    <button class="btn btn-light">Bootstrap</button>
    <button class="btn btn-dark">Bootstrap</button>
    <button class="btn btn-link">Bootstrap</button>

    <button class="btn btn-outline-primary">Primary</button>
</body>

</html>
