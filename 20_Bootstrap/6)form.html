<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</head>
<body>
    <div class="container mt-5">
        <div class="row mt-5">
            <div class="col-4"></div>
            <div class="col-4">
                <fomr>
                    <div class="m-3">
                        <input type="text" class="form-control" placeholder="Enter Name"/>
                    </div>


                    <div class="m-3 form-floating">
                        <input type="text" class="form-control-sm form-control" placeholder="Enter Name"/>
                        <label>Enter Name</label>
                    </div>



                    <div class="m-4">
                        <input type="password" class="form-control" placeholder="Enter Password"/>
                    </div>




                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" name="gender"/>Male
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" class="form-check-input" name="gender"/>Female
                    </div>




                    <div class="my-4">
                        <textarea class="form-control" rows="5"></textarea>
                    </div>





                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input"/>
                        <label>HTML</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input"/>
                        <label>CSS</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="checkbox" class="form-check-input"/>
                        <label>Java Script</label>
                    </div>



                    <div class="form-check form-switch m-4">
                        <input type="checkbox" class="form-check-input"/>
                        <label>Switch to Dark Mode</label>
                    </div>



                    <div class="m-4">
                        <select class="form-select">
                            <option>Select City</option>
                            <option>Delhi</option>
                            <option>Hyderabad</option>
                        </select>
                    </div>
                </fomr>
            </div>
            <div class="col-4"></div>
        </div>
    </div>
</body>
</html>
