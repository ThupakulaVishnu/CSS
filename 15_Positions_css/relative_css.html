<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        #container {
            width: 500px;
            height: 250px;
            border: 2px solid black;
            margin: 30px auto;
        }

        #box1 {
            position: relative;
            left: 60px;
            width: 200px;
            height: 150px;
            border: 2px dashed red;
            background-color: red;
        }

        #box2 {
            position: relative;
            right: 60px;
            width: 200px;
            height: 150px;
            border: 2px dashed red;
            background-color: red;
        }

        #box3 {
            position: relative;
            top: 60px;
            width: 200px;
            height: 150px;
            border: 2px dashed red;
            background-color: red;
        }

        #container1 {
            width: 500px;
            height: 250px;
            border: 2px solid black;
            margin: 90px auto;
        }

        #box4 {
            position: relative;
            bottom: 60px;
            width: 200px;
            height: 150px;
            border: 2px dashed red;
            background-color: red;
        }
    </style>
</head>

<body>
    <div id="container">
        Left
        <div id="box1">
        </div>
    </div>
    <div id="container">
        Right
        <div id="box2">
        </div>
    </div>
    <div id="container">
        Top
        <div id="box3">
        </div>
    </div>
    <h1><center>Bottom</center></h1>
    <div id="container1">

        <div id="box4">
        </div>
    </div>
</body>

</html>
